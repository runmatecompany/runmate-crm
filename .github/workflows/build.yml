name: Build desktop app (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # Univerzális binárist épít: Intel (x86_64) + Apple Silicon (aarch64) egy fájlban.
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Gyorsítótárazza a Rust függőségeket és a fordítási eredményeket build-ek között,
      # így csak a ténylegesen megváltozott kód fordul újra (percekkel gyorsabb).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/frontend/src-tauri

      - name: Install dependencies
        run: npm install

      # A háttér (backend + PostgreSQL) egy közös, központi gépen/szerveren fut,
      # nem ebbe a csomagba kerül — csak a Tauri asztali kliens épül itt.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/frontend
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name != 'main' && github.ref_name || format('dev-{0}', github.run_number) }}
          releaseName: "RunMate CRM ${{ github.ref_name }}"
          releaseBody: |
            ## 📥 Melyik fájlt töltsd le?

            Csak egyet kell letöltened, attól függően, milyen géped van.

            ### 🪟 Ha Windows-t használsz
            Töltsd le azt a fájlt, aminek a neve **`-setup.exe`**-re végződik.
            Utána: dupla kattintás rá → Tovább → Tovább → Telepítés. Kész.

            ### 🍎 Ha Mac-et (Apple/macOS) használsz
            Töltsd le azt a fájlt, aminek a neve **`.dmg`**-re végződik.
            Utána: dupla kattintás rá → húzd az ikont az "Applications" mappába. Kész.

            *(Nem biztos benne, melyik géped van? Ha bal alul van egy Start gomb, Windows. Ha bal felül van egy Apple 🍎 logó, Mac.)*

            ---

            A **"Source code (zip)"** és **"Source code (tar.gz)"** linkeket hagyd figyelmen kívül — azok csak a nyers programkód, nem a telepíthető alkalmazás.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
